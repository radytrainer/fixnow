# Optional: PostgreSQL in Docker instead of the local cluster script. Matches the default DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fixnow
      POSTGRES_HOST_AUTH_METHOD: trust # local development only
      POSTGRES_DB: fixnow
    ports:
      - "5440:5432"
    volumes:
      - fixnow-db:/var/lib/postgresql/data
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  fixnow-db:
